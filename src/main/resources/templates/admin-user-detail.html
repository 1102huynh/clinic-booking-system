<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .navbar h1 {
            font-size: 24px;
        }

        .logout-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
            flex: 1;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 28px;
            color: #333;
        }

        .alert {
            padding: 1rem;
            border-radius: 5px;
            margin-bottom: 1.5rem;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .detail-section {
            margin-bottom: 2rem;
        }

        .detail-section h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #667eea;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .detail-col {
            flex: 1;
        }

        .detail-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .detail-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .role-badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .role-admin {
            background: #e2d5ff;
            color: #6c3bb8;
        }

        .role-doctor {
            background: #d1ecf1;
            color: #0c5460;
        }

        .role-patient {
            background: #fff3cd;
            color: #856404;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);
            color: white;
        }

        .btn-warning:hover {
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .btn-danger:hover {
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
        }

        footer {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 1.5rem 2rem;
            margin-top: auto;
            flex-shrink: 0;
        }

        footer p {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .detail-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <h1>👤 User Details</h1>
        </div>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </nav>

    <div class="main-content">
        <div class="container">
            <a href="/admin/users" class="back-link">← Back to Users</a>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <div class="card" th:if="${user}">
                <div class="page-header">
                    <h2 class="page-title" th:text="${user.username}"></h2>
                    <span class="status-badge"
                          th:classappend="${user.enabled} ? 'status-active' : 'status-inactive'"
                          th:text="${user.enabled} ? 'Active' : 'Inactive'"></span>
                </div>

                <!-- User Information -->
                <div class="detail-section">
                    <h3>ℹ️ User Information</h3>
                    <div class="detail-row">
                        <div class="detail-col">
                            <div class="detail-label">Username</div>
                            <div class="detail-value" th:text="${user.username}"></div>
                        </div>
                        <div class="detail-col">
                            <div class="detail-label">Full Name</div>
                            <div class="detail-value" th:text="${user.fullName ?: 'N/A'}"></div>
                        </div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-col">
                            <div class="detail-label">Email</div>
                            <div class="detail-value" th:text="${user.email ?: 'N/A'}"></div>
                        </div>
                        <div class="detail-col">
                            <div class="detail-label">Role</div>
                            <span class="role-badge"
                                  th:classappend="${user.role == 'ADMIN' ? 'role-admin' : (user.role == 'DOCTOR' ? 'role-doctor' : 'role-patient')}"
                                  th:text="${user.role ?: 'N/A'}"></span>
                        </div>
                    </div>
                </div>

                <!-- Account Status -->
                <div class="detail-section">
                    <h3>🔐 Account Status</h3>
                    <div class="detail-row">
                        <div class="detail-col">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">
                                <span class="status-badge"
                                      th:classappend="${user.enabled} ? 'status-active' : 'status-inactive'"
                                      th:text="${user.enabled} ? 'Active' : 'Disabled'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <a href="/admin/users" class="btn btn-secondary">← Back to Users</a>
                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-warning">✎ Edit User</a>
                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display: inline; flex: 1;">
                        <button type="submit" class="btn btn-danger" style="width: 100%;"
                                onclick="return confirm('Are you sure you want to delete this user? This action cannot be undone.');">
                            🗑 Delete User
                        </button>
                    </form>
                    <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" style="display: inline; flex: 1;">
                        <button type="submit" class="btn"
                                th:text="${user.enabled} ? '🔒 Disable User' : '🔓 Enable User'"
                                style="width: 100%; background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);">
                        </button>
                    </form>
                </div>
            </div>

            <div class="card" th:if="!${user}">
                <div style="text-align: center; padding: 3rem; color: #666;">
                    <p style="font-size: 24px; margin-bottom: 1rem;">❌</p>
                    <p>User not found.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Clinic Booking System. All rights reserved.</p>
    </footer>
</body>
</html>
