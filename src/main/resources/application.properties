spring.application.name=clinic-booking-system

# ===============================
# = Server Configuration
# ===============================
server.port=8080

# ===============================
# = Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = Spring Mail
# ===============================
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your_email@gmail.com
#spring.mail.password=your_app_password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# = JWT Configuration
# ===============================
jwt.secret=super-secret-key-for-jwt
jwt.expiration=3600000   # 1 hour in milliseconds

# ===============================
# = Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.huynh.tdt.clinicbookingsystem=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=logs/clinic-app.log

# ===============================
# = Swagger/OpenAPI
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

