# Example for Gmail with App Password:
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=clinic@gmail.com
# spring.mail.password=xxxx xxxx xxxx xxxx (16-char app password)
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# = JWT Configuration
# ===============================
jwt.secret=super-secret-key-for-jwt
jwt.expiration=3600000   # 1 hour in milliseconds

# ===============================
# = Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.huynh.tdt.clinicbookingsystem=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=logs/clinic-app.log

# ===============================
# = Swagger/OpenAPI
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

